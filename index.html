<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>lofi forever</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Serif+Display:ital@0;1&display=swap");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --warm: #c97d40;
        --warm2: #e8b07a;
        --glass: rgba(10, 13, 18, 0.78);
        --border: rgba(255, 255, 255, 0.07);
        --text: rgba(255, 255, 255, 0.88);
        --dim: rgba(255, 255, 255, 0.35);
        --dimmer: rgba(255, 255, 255, 0.16);
        --radius: 22px;
        --mood-h: 28;
        /* Smooth colour transitions on mood change */
        transition:
          --warm 0.8s ease,
          --warm2 0.8s ease;
      }

      /* @property declarations let CSS custom properties animate smoothly */
      @property --warm {
        syntax: '<color>';
        inherits: true;
        initial-value: #c97d40;
      }
      @property --warm2 {
        syntax: '<color>';
        inherits: true;
        initial-value: #e8b07a;
      }

      html,
      body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: #080c12;
        font-family:
          'DM Mono',
          monospace;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      /* ── Generative background canvas ── */
      #bg {
        position: fixed;
        inset: 0;
        z-index: 0;
      }

      /* ── Bottom sheet ── */
      .sheet {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 10;
        background: var(--glass);
        backdrop-filter: blur(32px) saturate(1.5);
        -webkit-backdrop-filter: blur(32px) saturate(1.5);
        border-top: 1px solid var(--border);
        border-radius: var(--radius) var(--radius) 0 0;
        padding-bottom: env(safe-area-inset-bottom, 16px);
        max-height: 92vh;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }
      .sheet.settling {
        transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .handle {
        width: 36px;
        height: 4px;
        background: var(--dimmer);
        border-radius: 2px;
        margin: 12px auto 6px;
        cursor: grab;
        touch-action: none; /* drag handle only — sheet scroll stays free */
      }
      .handle:active {
        cursor: grabbing;
        background: var(--dim);
      }

      .sheet-body {
        padding: 14px 20px 0;
      }

      /* ── Track info row — play button left, title centre, key chip right ── */
      .info-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .info-text {
        flex: 1;
        min-width: 0;
      }
      .track-name {
        font-family:
          'DM Serif Display',
          serif;
        font-style: italic;
        font-size: clamp(1.1rem, 4.5vw, 1.4rem);
        color: var(--text);
        line-height: 1.1;
        transition: opacity 0.4s;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .track-name.fade {
        opacity: 0;
      }
      .track-sub {
        font-size: 0.6rem;
        color: var(--dim);
        letter-spacing: 0.08em;
        margin-top: 3px;
      }

      /* Key picker — tappable */
      .key-chip {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 6px 12px;
        cursor: pointer;
        flex-shrink: 0;
        transition: background 0.15s;
        min-width: 52px;
      }
      .key-chip:active {
        background: rgba(255, 255, 255, 0.12);
      }
      .key-val {
        font-family:
          'DM Serif Display',
          serif;
        font-size: 1.1rem;
        color: var(--warm);
        line-height: 1;
      }
      .key-lbl {
        font-size: 0.5rem;
        color: var(--dimmer);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-top: 2px;
      }

      /* ── Visualiser ── */
      .wave-wrap {
        margin: 4px -20px 2px;
        height: 56px;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.18);
        position: relative;
      }
      #vis {
        display: block;
        width: 100%;
        height: 56px;
      }

      /* ── Mood row ── */
      .mood-row {
        display: flex;
        gap: 6px;
        padding: 10px 0 8px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .mood-row::-webkit-scrollbar {
        display: none;
      }
      .mood-btn {
        font-family:
          'DM Mono',
          monospace;
        font-size: 0.62rem;
        letter-spacing: 0.06em;
        padding: 7px 13px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.05);
        color: var(--dim);
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition: all 0.15s;
        min-height: 34px;
        display: flex;
        align-items: center;
      }
      .mood-btn:active {
        opacity: 0.7;
      }
      .mood-btn.active {
        background: var(--warm);
        border-color: var(--warm);
        color: #1a0e04;
      }

      /* ── Skip button (still used inline next to play) ── */
      .btn-play {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: var(--warm);
        border: none;
        cursor: pointer;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 24px color-mix(in srgb, var(--warm) 35%, transparent);
        transition:
          transform 0.1s,
          box-shadow 0.1s,
          background 0.8s ease;
      }
      .btn-play:active {
        transform: scale(0.91);
        box-shadow: 0 0 12px color-mix(in srgb, var(--warm) 20%, transparent);
      }
      .btn-play svg {
        width: 20px;
        height: 20px;
        fill: #1a0e04;
      }

      /* Skip button */
      .btn-skip {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border);
        cursor: pointer;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s;
      }
      .btn-skip:active {
        background: rgba(255, 255, 255, 0.12);
      }
      .btn-skip svg {
        width: 18px;
        height: 18px;
        stroke: var(--dim);
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Volume — compact row below mood pills */
      .vol-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 10px;
      }
      .vol-row .ctrl-lbl {
        flex-shrink: 0;
        width: 22px;
      }

      /* Status bar */
      .status-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding-bottom: 6px;
      }
      .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--dimmer);
        flex-shrink: 0;
        transition: background 0.3s;
      }
      .dot.live {
        background: #5ec47a;
        animation: pulse 2.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      .status-txt {
        font-size: 0.55rem;
        color: var(--dimmer);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      /* ── Shared range style ── */

      /* ── Mixer drawer ── */
      .mixer-toggle {
        width: 100%;
        background: transparent;
        border: none;
        border-top: 1px solid var(--border);
        padding: 10px 20px;
        font-family:
          'DM Mono',
          monospace;
        font-size: 0.58rem;
        color: var(--dimmer);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 40px;
        transition: color 0.15s;
      }
      .mixer-toggle:active {
        color: var(--warm);
      }
      .mixer-arrow {
        width: 16px;
        height: 16px;
        stroke: var(--dimmer);
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        transition: transform 0.25s;
      }
      .mixer-toggle.open .mixer-arrow {
        transform: rotate(180deg);
      }

      .mixer-panel {
        display: none;
        padding: 8px 20px 4px;
      }
      .mixer-panel.open {
        display: block;
      }

      .mx-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 9px;
        min-height: 34px;
        border-radius: 4px;
      }
      .mx-lbl {
        font-size: 0.58rem;
        color: var(--dim);
        width: 64px;
        flex-shrink: 0;
        letter-spacing: 0.04em;
      }

      /* Thumb flash — the range input's knob pops when the instrument plays */
      .mx-row input[type="range"].flash::-webkit-slider-thumb {
        background: #fff;
        box-shadow:
          0 0 6px var(--warm),
          0 0 2px #fff;
        transform: scale(1.35);
      }
      .mx-row input[type="range"].flash::-moz-range-thumb {
        background: #fff;
        box-shadow:
          0 0 6px var(--warm),
          0 0 2px #fff;
        transform: scale(1.35);
      }
      input[type="range"] {
        -webkit-appearance: none;
        width: 100%;
        height: 3px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 2px;
        outline: none;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--warm);
        border: 2px solid rgba(0, 0, 0, 0.4);
        cursor: pointer;
        transition:
          transform 0.06s ease,
          background 0.06s ease,
          box-shadow 0.06s ease;
      }
      input[type="range"]::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--warm);
        border: 2px solid rgba(0, 0, 0, 0.4);
        transition:
          transform 0.06s ease,
          background 0.06s ease,
          box-shadow 0.06s ease;
      }
      .mx-row input[type="range"] {
        flex: 1;
      }
      .mx-val {
        font-size: 0.58rem;
        color: var(--dimmer);
        width: 26px;
        text-align: right;
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
      }
      .mx-div {
        height: 1px;
        background: var(--border);
        margin: 4px 0 10px;
      }
    </style>
  </head>
  <body>
    <!-- Generative background -->

    <canvas id="bg"></canvas>

    <!-- Bottom sheet -->

    <div class="sheet" id="sheet">
      <div class="handle"></div>
      <div class="sheet-body">
        <!-- Play + title + key -->
        <div class="info-row">
          <button class="btn-play" id="playBtn" aria-label="Play">
            <svg id="playIcon" viewBox="0 0 20 20">
              <polygon points="4,2 18,10 4,18" />
            </svg>
          </button>
          <button class="btn-skip" id="skipBtn" aria-label="New progression">
            <svg viewBox="0 0 18 18">
              <polyline points="2,4 10,9 2,14" />
              <polyline points="9,4 17,9 9,14" />
            </svg>
          </button>
          <div class="info-text">
            <div class="track-name" id="trackName">lofi forever</div>
            <div class="track-sub" id="trackSub">tap play to begin</div>
          </div>
          <div class="key-chip" id="keyChip" title="Tap to change key">
            <span class="key-val" id="keyVal">&mdash;</span>
            <span class="key-lbl">key</span>
          </div>
        </div>

        <!-- Waveform -->
        <div class="wave-wrap">
          <canvas id="vis" width="400" height="56"></canvas>
        </div>

        <!-- Mood -->
        <div class="mood-row">
          <button class="mood-btn active" data-mood="rainy">rainy</button>
          <button class="mood-btn" data-mood="late">late night</button>
          <button class="mood-btn" data-mood="cafe">café</button>
          <button class="mood-btn" data-mood="sleepy">sleepy</button>
        </div>

        <!-- Volume -->
        <div class="vol-row">
          <span class="ctrl-lbl">vol</span>
          <input
            type="range"
            id="volSlider"
            min="0"
            max="1"
            step="0.01"
            value="0.65"
          />
        </div>

        <!-- Status -->
        <div class="status-bar">
          <div class="dot" id="dot"></div>
          <span class="status-txt" id="statusTxt">ready</span>
        </div>
      </div>

      <!-- Controls panel -->

      <button class="mixer-toggle" id="mixerToggle">
        <span>controls</span>
        <svg class="mixer-arrow" viewBox="0 0 16 16">
          <polyline points="2,5 8,11 14,5" />
        </svg>
      </button>
      <div class="mixer-panel" id="mixerPanel">
        <div class="mx-row" id="mx-drums">
          <span class="mx-lbl">drums</span>
          <input
            type="range"
            data-track="drums"
            min="0"
            max="1"
            step="0.01"
            value="0.9"
          />
          <span class="mx-val" id="val-drums">90</span>
        </div>
        <div class="mx-row" id="mx-bass">
          <span class="mx-lbl">bass</span>
          <input
            type="range"
            data-track="bass"
            min="0"
            max="1"
            step="0.01"
            value="0.85"
          />
          <span class="mx-val" id="val-bass">85</span>
        </div>
        <div class="mx-row" id="mx-comp">
          <span class="mx-lbl">piano</span>
          <input
            type="range"
            data-track="comp"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
          />
          <span class="mx-val" id="val-comp">80</span>
        </div>
        <div class="mx-row" id="mx-melody">
          <span class="mx-lbl">melody</span>
          <input
            type="range"
            data-track="melody"
            min="0"
            max="1"
            step="0.01"
            value="0.75"
          />
          <span class="mx-val" id="val-melody">75</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">hiss</span>
          <input
            type="range"
            data-track="hiss"
            min="0"
            max="1"
            step="0.01"
            value="0.5"
          />
          <span class="mx-val" id="val-hiss">50</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">scratch</span>
          <input
            type="range"
            data-track="scratches"
            min="0"
            max="1"
            step="0.01"
            value="0.7"
          />
          <span class="mx-val" id="val-scratches">70</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">hum</span>
          <input
            type="range"
            data-track="hum"
            min="0"
            max="1"
            step="0.01"
            value="0.4"
          />
          <span class="mx-val" id="val-hum">40</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">warp</span>
          <input
            type="range"
            id="warpSlider"
            min="0"
            max="1"
            step="0.01"
            value="0.3"
          />
          <span class="mx-val" id="val-warp">30</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">ambience</span>
          <input
            type="range"
            data-track="ambience"
            min="0"
            max="1"
            step="0.01"
            value="0.6"
          />
          <span class="mx-val" id="val-ambience">60</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">rain</span>
          <input
            type="range"
            id="rainSlider"
            min="0"
            max="1"
            step="0.01"
            value="0.4"
          />
          <span class="mx-val" id="val-rain">40</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">reverb</span>
          <input
            type="range"
            id="reverbSlider"
            min="0"
            max="1"
            step="0.01"
            value="0.3"
          />
          <span class="mx-val" id="val-reverb">30</span>
        </div>

        <div class="mx-div"></div>

        <div class="mx-row">
          <span class="mx-lbl">tempo</span>
          <input
            type="range"
            id="bpmSlider"
            min="45"
            max="95"
            step="1"
            value="68"
            style="flex: 1"
          />
          <span class="mx-val" id="bpmVal">&mdash;</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">complexity</span>
          <input
            type="range"
            id="complexitySlider"
            min="0"
            max="1"
            step="0.01"
            value="0.5"
          />
          <span class="mx-val" id="val-complexity">50</span>
        </div>
      </div>
    </div>

    <script type="module">
      // Phases 2-4 bridge: import the data + helpers, plus (commit C) the
      // audio graph / instruments / ambience modules. Stash an AppState
      // store on window so inline init can wire it up. Dispatch
      // `lofi:ready` so the classic inline script (wrapped in a listener)
      // can run.
      import {
        applyMoodReverb,
        applySettingToAudio,
        applyWarp,
        bassOct,
        buildRainLayers,
        createStore,
        currentSectionProg as currentSectionProgPure,
        DEFAULT_PROG,
        DEFAULT_SETTINGS,
        FORMS,
        generatePhrase,
        GHOST_PAT,
        HAT_PAT,
        initAudio as initAudioPure,
        initialAppState,
        KICK_PAT_NORMAL,
        KICK_PAT_SOFT,
        melodyOct,
        MOOD_META,
        nextFormPosition,
        OPEN_PAT,
        playBass,
        playComp,
        playHat,
        playKick,
        playMelody,
        playSnare,
        SNARE_PAT,
        startAmbience,
        startScratches,
        startTapeHiss,
        stopAmbience,
        VOICINGS,
        walkingBassNotes,
      } from "./dist/main.js";

      Object.assign(window, {
        applyMoodReverb,
        applySettingToAudioPure: applySettingToAudio,
        applyWarpPure: applyWarp,
        bassOct,
        buildRainLayers,
        currentSectionProgPure,
        DEFAULT_PROG,
        DEFAULT_SETTINGS,
        FORMS,
        generatePhrase,
        GHOST_PAT,
        HAT_PAT,
        initAudioPure,
        KICK_PAT_NORMAL,
        KICK_PAT_SOFT,
        melodyOct,
        MOOD_META,
        nextFormPosition,
        OPEN_PAT,
        playBassPure: playBass,
        playCompPure: playComp,
        playHatPure: playHat,
        playKickPure: playKick,
        playMelodyPure: playMelody,
        playSnarePure: playSnare,
        SNARE_PAT,
        startAmbience,
        startScratches,
        startTapeHiss,
        stopAmbience,
        VOICINGS,
        walkingBassNotes,
      });

      window.__store = createStore(initialAppState());
      window.dispatchEvent(new Event("lofi:ready"));
    </script>
    <script>
      window.addEventListener("lofi:ready", () => {
      // ── Generative background — WebGPU flow field with Canvas2D fallback ──────────

      const bgCanvas = document.getElementById("bg");
      let bgMood = "rainy";
      let bgAmplitude = 0;

      const MOOD_COLOURS = {
        rainy: { h: 210, s: 40, r: 10, g: 15, b: 24 },
        late: { h: 260, s: 30, r: 13, g: 10, b: 24 },
        cafe: { h: 28, s: 55, r: 20, g: 10, b: 4 },
        sleepy: { h: 190, s: 35, r: 6, g: 14, b: 18 },
      };

      // ── Try WebGPU ────────────────────────────────────────────────────────────────
      async function tryWebGPU() {
        try {
          if (!navigator.gpu) return false;
          const adapter = await navigator.gpu.requestAdapter();
          if (!adapter) return false;
          const device = await adapter.requestDevice();
          const ctx = bgCanvas.getContext("webgpu");
          if (!ctx) return false;

          const format = navigator.gpu.getPreferredCanvasFormat();

          function resize() {
            const w = window.visualViewport?.width || window.innerWidth;
            const h = window.visualViewport?.height || window.innerHeight;
            bgCanvas.width = Math.max(2, Math.floor(w * devicePixelRatio));
            bgCanvas.height = Math.max(2, Math.floor(h * devicePixelRatio));
            bgCanvas.style.width = w + "px";
            bgCanvas.style.height = h + "px";
            ctx.configure({ device, format, alphaMode: "opaque" });
          }
          resize();
          window.addEventListener("resize", resize);
          window.addEventListener("orientationchange", () =>
            setTimeout(resize, 200),
          );
          if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", resize);
          }

          // Uniforms layout (std140-ish, padded to 16-byte boundaries):
          // time, amp, w, h          (4 floats = 16 bytes)
          // baseR, baseG, baseB, _p1 (4 floats = 16 bytes)
          // 3 blob colours: each vec4(r,g,b,intensity) = 48 bytes
          // Total = 80 bytes
          const uniformBuf = device.createBuffer({
            size: 96,
            usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
          });

          const shaderCode = `
struct Uniforms {
  time: f32, amp: f32, w: f32, h: f32,
  base: vec4f,
  blob0: vec4f,
  blob1: vec4f,
  blob2: vec4f,
}
@group(0) @binding(0) var<uniform> u: Uniforms;

struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f }

@vertex fn vs(@builtin(vertex_index) vi: u32) -> VO {
  // Fullscreen triangle
  var positions = array<vec2f, 3>(
    vec2f(-1.0, -1.0),
    vec2f( 3.0, -1.0),
    vec2f(-1.0,  3.0),
  );
  let p = positions[vi];
  var out: VO;
  out.pos = vec4f(p, 0.0, 1.0);

          );
        }

        // ── Drums — pattern density scales with complexity ──────────────────────
        const kickPat =
          currentMood === "sleepy" || currentMood === "late"
            ? KICK_PAT_SOFT
            : KICK_PAT_NORMAL;

        for (let i = 0; i < 16; i++) {
          const t = swungTime(i, barStart);

          // Kick — full pattern always (but the SOFT pattern is already sparser)
          if (kickPat[i]) playKick(t);

          // Snare backbeat — always plays
          if (SNARE_PAT[i]) playSnare(t, false);

          // Ghost snares — scale with complexity
          if (GHOST_PAT[i] && Math.random() < complexity * 0.7)
            playSnare(t, true);

          // Hi-hat — at low complexity, only on quarter beats (0,4,8,12)
          // At mid+ complexity, full 8th-note pattern
          if (HAT_PAT[i]) {
            const isQuarter = i % 4 === 0;
            if (isQuarter || complexity > 0.35) {
              const vol = 0.05 + Math.random() * 0.025;
              playHat(
                t,
                false,
                vol * (isQuarter ? 1.0 : 0.6 + complexity * 0.4),
              );
            }
          }

          // 16th-note hi-hat flourishes (positions 1,3,5,7,9,11,13,15) — only at high complexity
          if (
            !HAT_PAT[i] &&
            complexity > 0.75 &&
            Math.random() < (complexity - 0.65) * 2
          ) {
            playHat(t, false, 0.025 + Math.random() * 0.02);
          }

          // Open hat — only at mid+ complexity (and never sleepy)
          if (OPEN_PAT[i] && currentMood !== "sleepy" && complexity > 0.4) {
            playHat(t, true, 0.06);
          }
        }
      }

      function scheduler() {
        // 3s lookahead — survives Safari's ~1s background setTimeout throttle.
        // Web Audio clock stays precise even when JS is throttled; we just need
        // to have pre-scheduled far enough ahead before the tab is hidden.
        const LOOKAHEAD = 3.0;
        const barDur = beatDur() * 4;
        while (nextBarTime < actx.currentTime + LOOKAHEAD) {
          scheduleBar(nextBarTime);
          // Advance chord cycle within current section
          currentProgIdx++;
          // Advance the form playhead once per bar
          advanceFormPlayhead();
          nextBarTime += barDur;
        }
        schedulerTimer = setTimeout(scheduler, 50);
      }

      // ── Background resilience ────────────────────────────────────────────────────
      // On tab restore: resume AudioContext (Safari suspends it when hidden),
      // then immediately flush the scheduler so the 3s buffer is refilled.
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState !== "visible" || !isPlaying) return;
        if (actx && actx.state === "suspended") {
          actx.resume().then(() => {
            clearTimeout(schedulerTimer);
            scheduler();
          });
        } else if (actx) {
          clearTimeout(schedulerTimer);
          scheduler();
        }
      });

      function newProgression(fresh = true) {
        const meta = MOOD_META[currentMood];
        if (fresh) {
          currentKey = pick(meta.key_pool);
          currentBPM = randInt(...meta.bpmRange);
          document.getElementById("bpmSlider").value = currentBPM;
          // Reset form playhead to beginning
          currentForm = FORMS[currentMood];
          formSectionIdx = 0;
          formBarInSection = 0;
          formBarInProg = 0;
          currentProgIdx = 0;
          currentPhrase = [];
          phraseBarIdx = 0;
          applyMoodReverb();
        } else {
          // Soft refresh — keep key/BPM, just restart the form
          currentForm = FORMS[currentMood];
          formSectionIdx = 0;
          formBarInSection = 0;
          formBarInProg = 0;
          currentProgIdx = 0;
          currentPhrase = [];
          phraseBarIdx = 0;
        }
        bgMood = currentMood;
        const name = pick(meta.names),
          keyName = NOTES[currentKey];
        const el = document.getElementById("trackName");
        el.classList.add("fade");
        setTimeout(() => {
          el.textContent = name;
          document.getElementById("trackSub").textContent =
            `${keyName} · ${currentBPM} bpm`;
          document.getElementById("bpmVal").textContent = currentBPM;
          document.getElementById("keyVal").textContent = keyName;
          el.classList.remove("fade");
        }, 400);
      }

      // ── Visualiser ────────────────────────────────────────────────────────────────
      // Frequency-band bars with peak followers. Bigger, more visible, iOS-safe.
      const visCv = document.getElementById("vis");
      const visCtx = visCv.getContext("2d");

      const NUM_BARS = 32;
      const barPeaks = new Float32Array(NUM_BARS); // smoothed peak values
      const barFalls = new Float32Array(NUM_BARS); // peak hold/drop markers

      let visW = 0,
        visH = 0;

      function syncVisSize() {
        const dpr = window.devicePixelRatio || 1;
        const rect = visCv.getBoundingClientRect();
        let cssW = rect.width;
        if (cssW < 2) cssW = visCv.parentElement.getBoundingClientRect().width;
        if (cssW < 2) cssW = window.innerWidth - 40;
        const cssH = 56;
        const newW = Math.max(4, Math.round(cssW * dpr));
        const newH = Math.max(4, Math.round(cssH * dpr));
        if (visCv.width !== newW) visCv.width = newW;
        if (visCv.height !== newH) visCv.height = newH;
        visW = newW;
        visH = newH;
      }

      // ResizeObserver handles every layout shift natively — iOS supports it since 13.4
      if (typeof ResizeObserver !== "undefined") {
        new ResizeObserver(syncVisSize).observe(visCv);
      }
      // Belt-and-braces: poll a few times for iOS Safari which sometimes ignores RO at first paint
      [0, 100, 300, 800, 2000].forEach((t) => setTimeout(syncVisSize, t));
      window.addEventListener("resize", syncVisSize);
      window.addEventListener("orientationchange", () =>
        setTimeout(syncVisSize, 250),
      );
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", syncVisSize);
      }

      function getAccentRgb() {
        // Read --warm from CSS as rgb triple
        const v = getComputedStyle(document.documentElement)
          .getPropertyValue("--warm")
          .trim();
        // Could be hex (#rrggbb) or rgb(...)
        if (v.startsWith("#")) {
          const r = parseInt(v.slice(1, 3), 16);
          const g = parseInt(v.slice(3, 5), 16);
          const b = parseInt(v.slice(5, 7), 16);
          return [r, g, b];
        }
        const m = v.match(/(\d+(?:\.\d+)?)/g);
        if (m && m.length >= 3) return [+m[0], +m[1], +m[2]];
        return [201, 125, 64];
      }

      function drawVis() {
        requestAnimationFrame(drawVis);

        // Self-heal: re-measure each frame in case layout shifted
        if (visW < 4 || visH < 4) {
          syncVisSize();
          if (visW < 4) return;
        }

        const W = visW,
          H = visH;
        const [ar, ag, ab] = getAccentRgb();
        // Lighter variant for top of bars
        const lar = Math.min(255, ar + 31);
        const lag = Math.min(255, ag + 51);
        const lab = Math.min(255, ab + 58);

        // Subtle background gradient
        const bg = visCtx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, "rgba(0,0,0,0.0)");
        bg.addColorStop(1, "rgba(0,0,0,0.35)");
        visCtx.fillStyle = bg;
        visCtx.fillRect(0, 0, W, H);

        if (!analyser) {
          const t = performance.now() * 0.001;
          const pulse = 0.2 + 0.15 * Math.sin(t * 1.2);
          visCtx.fillStyle = `rgba(${ar},${ag},${ab},${pulse})`;
          const barW = W / NUM_BARS;
          for (let i = 0; i < NUM_BARS; i++) {
            const idleH = (1 + Math.sin(t * 0.8 + i * 0.4)) * 2 + 1;
            const x = i * barW;
            visCtx.fillRect(
              x + barW * 0.2,
              H / 2 - idleH / 2,
              barW * 0.6,
              idleH,
            );
          }
          return;
        }

        const binCount = analyser.frequencyBinCount;
        const buf = new Uint8Array(binCount);
        analyser.getByteFrequencyData(buf);

        const barW = W / NUM_BARS;
        const dpr = window.devicePixelRatio || 1;

        for (let i = 0; i < NUM_BARS; i++) {
          const fLo = Math.pow(i / NUM_BARS, 2);
          const fHi = Math.pow((i + 1) / NUM_BARS, 2);
          const binLo = Math.floor(fLo * binCount);
          const binHi = Math.max(binLo + 1, Math.floor(fHi * binCount));
          let sum = 0;
          for (let b = binLo; b < binHi; b++) sum += buf[b];
          const avg = sum / (binHi - binLo) / 255;

          if (avg > barPeaks[i]) barPeaks[i] = barPeaks[i] * 0.3 + avg * 0.7;
          else barPeaks[i] = barPeaks[i] * 0.86 + avg * 0.14;

          if (barPeaks[i] > barFalls[i]) barFalls[i] = barPeaks[i];
          else barFalls[i] = Math.max(barPeaks[i], barFalls[i] - 0.012);

          const v = barPeaks[i];
          const barH = v * H * 0.95;
          const x = i * barW;
          const padX = Math.max(1, barW * 0.18);

          // Gradient fill — accent colour, lighter at top
          const grad = visCtx.createLinearGradient(0, H - barH, 0, H);
          grad.addColorStop(0, `rgba(${lar},${lag},${lab},${0.4 + v * 0.6})`);
          grad.addColorStop(1, `rgba(${ar},${ag},${ab},${0.7 + v * 0.3})`);
          visCtx.fillStyle = grad;
          visCtx.fillRect(x + padX, H - barH, barW - padX * 2, barH);

          // Peak marker
          if (barFalls[i] > 0.05) {
            const peakY = H - barFalls[i] * H * 0.95;
            visCtx.fillStyle = `rgba(${lar},${lag},${lab},${0.6 + v * 0.4})`;
            visCtx.fillRect(x + padX, peakY, barW - padX * 2, Math.max(1, dpr));
          }
        }
      }
      drawVis();

      // ── UI ────────────────────────────────────────────────────────────────────────

      // Play/pause — swap SVG icon
      const playBtn = document.getElementById("playBtn");
      const playIcon = document.getElementById("playIcon");

      function setPlayIcon(playing) {
        if (playing) {
          // Pause icon: two bars
          playIcon.innerHTML =
            '<rect x="3" y="2" width="5" height="16" rx="1"/><rect x="12" y="2" width="5" height="16" rx="1"/>';
          playIcon.setAttribute("viewBox", "0 0 20 20");
        } else {
          // Play triangle
          playIcon.innerHTML = '<polygon points="4,2 18,10 4,18"/>';
          playIcon.setAttribute("viewBox", "0 0 20 20");
        }
      }

      playBtn.addEventListener("click", async () => {
        if (!actx) initAudio();
        if (actx.state === "suspended") await actx.resume();
        const userVol = sliderToGain(
          parseFloat(document.getElementById("volSlider").value),
        );

        if (isPlaying) {
          // Fade out then stop
          const t = actx.currentTime;
          masterGain.gain.cancelScheduledValues(t);
          masterGain.gain.setValueAtTime(masterGain.gain.value, t);
          masterGain.gain.linearRampToValueAtTime(0.0001, t + 0.5);
          setTimeout(() => {
            clearTimeout(schedulerTimer);
            isPlaying = false;
            stopAmbience();
          }, 520);
          setPlayIcon(false);
          document.getElementById("dot").className = "dot";
          document.getElementById("statusTxt").textContent = "paused";
        } else {
          // Start silent, then fade in
          const t0 = actx.currentTime;
          masterGain.gain.cancelScheduledValues(t0);
          masterGain.gain.setValueAtTime(0.0001, t0);
          newProgression(true);
          nextBarTime = t0 + 0.1; // start scheduling immediately, 3s lookahead fills the buffer
          isPlaying = true;
          scheduler();
          startAmbience(currentMood);
          masterGain.gain.linearRampToValueAtTime(userVol, t0 + 1.2);
          setPlayIcon(true);
          document.getElementById("dot").className = "dot live";
          document.getElementById("statusTxt").textContent = "playing \u221e";
        }
      });

      // Skip
      document.getElementById("skipBtn").addEventListener("click", () => {
        if (isPlaying) newProgression(true);
      });

      // BPM slider — live tempo control
      document.getElementById("bpmSlider").addEventListener("input", (e) => {
        currentBPM = parseInt(e.target.value);
        document.getElementById("bpmVal").textContent = currentBPM;
        document.getElementById("trackSub").textContent =
          `${NOTES[currentKey]} · ${currentBPM} bpm`;
      });

      // Key chip — cycle through chromatic keys
      document.getElementById("keyChip").addEventListener("click", () => {
        currentKey = (currentKey + 1) % 12;
        const keyName = NOTES[currentKey];
        document.getElementById("keyVal").textContent = keyName;
        document.getElementById("trackSub").textContent =
          `${keyName} · ${currentBPM} bpm`;
        // Regenerate phrase for new key on next bar
        currentPhrase = [];
        phraseBarIdx = 0;
      });

      // Volume — smooth ramp, doesn't fight in-progress fades
      let moodChangeInProgress = false;
      document.getElementById("volSlider").addEventListener("input", (e) => {
        if (!masterGain || moodChangeInProgress) return;
        const slider = parseFloat(e.target.value);
        saveCurrentSetting("vol", slider);
        const target = slider ** 2;
        const t = actx.currentTime;
        masterGain.gain.cancelScheduledValues(t);
        masterGain.gain.setValueAtTime(masterGain.gain.value, t);
        masterGain.gain.linearRampToValueAtTime(target, t + 0.05);
      });

      // Mixer toggle
      document.getElementById("mixerToggle").addEventListener("click", () => {
        const toggle = document.getElementById("mixerToggle");
        const panel = document.getElementById("mixerPanel");
        toggle.classList.toggle("open");
        panel.classList.toggle("open");
      });

      // Perceptual (log-ish) gain curve: slider 0..1 → gain 0..1, but quadratic
      function sliderToGain(v) {
        return v * v;
      }

      // ── Per-mood slider settings ─────────────────────────────────────────────────
      // Each mood has its own defaults that suit its character.

      // Deep clone so writes don't leak between moods
      const moodSettings = {};
      for (const m of Object.keys(DEFAULT_SETTINGS)) {
        moodSettings[m] = { ...DEFAULT_SETTINGS[m] };
      }

      // Track → slider selector map
      const TRACK_SLIDERS = {
        drums: 'input[data-track="drums"]',
        bass: 'input[data-track="bass"]',
        comp: 'input[data-track="comp"]',
        melody: 'input[data-track="melody"]',
        hiss: 'input[data-track="hiss"]',
        scratches: 'input[data-track="scratches"]',
        hum: 'input[data-track="hum"]',
        ambience: 'input[data-track="ambience"]',
        warp: "#warpSlider",
        rain: "#rainSlider",
        reverb: "#reverbSlider",
        complexity: "#complexitySlider",
        vol: "#volSlider",
      };

      function saveCurrentSetting(key, value) {
        if (!moodSettings[currentMood]) moodSettings[currentMood] = {};
        moodSettings[currentMood][key] = value;
      }

      function applyMoodSettings(mood) {
        const s = moodSettings[mood] || DEFAULT_SETTINGS[mood];
        Object.entries(s).forEach(([key, val]) => {
          const slider = document.querySelector(TRACK_SLIDERS[key]);
          if (!slider) return;
          slider.value = val;
          // Update displayed % readout
          const labelEl = document.getElementById(
            `val-${key === "rain" ? "rain" : key === "complexity" ? "complexity" : key}`,
          );
          if (labelEl) labelEl.textContent = Math.round(val * 100);
          // Apply to audio
          applySettingToAudio(key, val);
        });
      }

      function applySettingToAudio(key, val) {
        if (key === "complexity") {
          complexity = val;
          return;
        }
        // Suppress vol slider during a mood-change crossfade so it doesn't
        // fight the master-gain envelope. Other keys are always safe.
        if (key === "vol" && moodChangeInProgress) return;
        if (window.__audio) window.applySettingToAudioPure(window.__audio, key, val);
      }

      // Per-track faders
      document.querySelectorAll("input[data-track]").forEach((slider) => {
        slider.addEventListener("input", (e) => {
          const track = e.target.dataset.track;
          const val = parseFloat(e.target.value);
          document.getElementById(`val-${track}`).textContent = Math.round(
            val * 100,
          );
          saveCurrentSetting(track, val);
          if (trackGains[track])
            trackGains[track].gain.value = sliderToGain(val);
        });
      });

      // Rain
      document.getElementById("rainSlider").addEventListener("input", (e) => {
        const val = parseFloat(e.target.value);
        document.getElementById("val-rain").textContent = Math.round(val * 100);
        saveCurrentSetting("rain", val);
        if (rainGainNode) rainGainNode.gain.value = sliderToGain(val);
      });

      // Reverb wet
      document.getElementById("reverbSlider").addEventListener("input", (e) => {
        const val = parseFloat(e.target.value);
        document.getElementById("val-reverb").textContent = Math.round(val * 100);
        saveCurrentSetting("reverb", val);
        if (reverbGain) reverbGain.gain.value = val;
      });

      // Warp (wow + flutter intensity)
      document.getElementById("warpSlider").addEventListener("input", (e) => {
        const val = parseFloat(e.target.value);
        document.getElementById("val-warp").textContent = Math.round(val * 100);
        saveCurrentSetting("warp", val);
        if (warpModGain) warpModGain.gain.value = val;
      });

      // Complexity
      let lastComplexity = 0.5;
      document
        .getElementById("complexitySlider")
        .addEventListener("input", (e) => {
          complexity = parseFloat(e.target.value);
          document.getElementById("val-complexity").textContent = Math.round(
            complexity * 100,
          );
          saveCurrentSetting("complexity", complexity);
          if (Math.abs(complexity - lastComplexity) > 0.2) {
            currentPhrase = [];
            phraseBarIdx = 0;
            lastComplexity = complexity;
          }
        });

      // Mood UI palettes — accent colour per mood
      const MOOD_UI = {
        rainy: { warm: "#7aa6d8", warm2: "#a8c4e8" }, // soft blue
        late: { warm: "#a886d8", warm2: "#c4a8e8" }, // soft purple
        cafe: { warm: "#c97d40", warm2: "#e8b07a" }, // warm amber (original)
        sleepy: { warm: "#6db5a8", warm2: "#9dd1c5" }, // soft teal
      };

      function applyMoodUI(mood) {
        const palette = MOOD_UI[mood] || MOOD_UI.cafe;
        document.documentElement.style.setProperty("--warm", palette.warm);
        document.documentElement.style.setProperty("--warm2", palette.warm2);
      }

      // Mood buttons — crossfade audio when switching mood while playing
      function changeMood(newMood) {
        document.querySelectorAll(".mood-btn").forEach((b) => {
          b.classList.toggle("active", b.dataset.mood === newMood);
        });
        bgMood = newMood;
        applyMoodUI(newMood);

        if (!isPlaying) {
          currentMood = newMood;
          // Restore sliders for this mood (audio context may not exist yet — that's fine)
          applyMoodSettings(newMood);
          return;
        }

        if (moodChangeInProgress) return;
        moodChangeInProgress = true;

        const now = actx.currentTime;
        const fadeOut = 0.7,
          fadeIn = 1.2;

        // Fade master down (using current value, not new mood's vol yet)
        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.setValueAtTime(masterGain.gain.value, now);
        masterGain.gain.linearRampToValueAtTime(0.0001, now + fadeOut);

        setTimeout(
          () => {
            currentMood = newMood;
            // Restore THIS mood's slider settings — updates sliders, displays, and audio
            applyMoodSettings(newMood);
            newProgression(true);
            startAmbience(newMood);
            // Fade in to the new mood's saved volume
            const userVol = sliderToGain(
              parseFloat(document.getElementById("volSlider").value),
            );
            const t = actx.currentTime;
            masterGain.gain.cancelScheduledValues(t);
            masterGain.gain.setValueAtTime(0.0001, t);
            masterGain.gain.linearRampToValueAtTime(userVol, t + fadeIn);
            moodChangeInProgress = false;
          },
          fadeOut * 1000 + 30,
        );
      }

      document.querySelectorAll(".mood-btn").forEach((btn) => {
        btn.addEventListener("click", () => changeMood(btn.dataset.mood));
      });

      // Initialise UI to default mood
      applyMoodUI(currentMood);

      // Initialise slider positions for the default mood (audio context not yet,
      // so applySettingToAudio's gain ops will be no-ops where they need actx).
      // On first play, initAudio will read the slider values directly.
      applyMoodSettings(currentMood);

      // ── Draggable bottom sheet ────────────────────────────────────────────────────
      (function () {
        const sheet = document.getElementById("sheet");
        const handle = sheet.querySelector(".handle");
        let dragging = false,
          startY = 0,
          startH = 0;
        const minH = 180; // px — collapsed (just controls visible)
        const maxH = () => window.innerHeight * 0.88;

        function clamp(v) {
          return Math.max(minH, Math.min(maxH(), v));
        }

        function onStart(e) {
          dragging = true;
          startY = e.touches ? e.touches[0].clientY : e.clientY;
          startH = sheet.offsetHeight;
          sheet.classList.remove("settling");
          document.addEventListener("mousemove", onMove);
          document.addEventListener("mouseup", onEnd);
          document.addEventListener("touchmove", onMove, { passive: false });
          document.addEventListener("touchend", onEnd);
        }
        function onMove(e) {
          if (!dragging) return;
          e.preventDefault();
          const y = e.touches ? e.touches[0].clientY : e.clientY;
          const delta = startY - y; // drag up = positive = taller
          sheet.style.height = clamp(startH + delta) + "px";
        }
        function onEnd() {
          if (!dragging) return;
          dragging = false;
          document.removeEventListener("mousemove", onMove);
          document.removeEventListener("mouseup", onEnd);
          document.removeEventListener("touchmove", onMove);
          document.removeEventListener("touchend", onEnd);
          // Snap to nearest anchor: collapsed ~220 or expanded ~75vh
          const h = sheet.offsetHeight;
          const mid = window.innerHeight * 0.45;
          sheet.classList.add("settling");
          sheet.style.height =
            (h < mid ? 220 : window.innerHeight * 0.75) + "px";
        }

        handle.addEventListener("mousedown", onStart);
        handle.addEventListener("touchstart", onStart, { passive: true });
      })();

      }); // end window.addEventListener("lofi:ready", ...)
    </script>
  </body>
</html>
