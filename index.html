<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>lofi forever</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Serif+Display:ital@0;1&display=swap");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --warm: #c97d40;
        --warm2: #e8b07a;
        --glass: rgba(10, 13, 18, 0.78);
        --border: rgba(255, 255, 255, 0.07);
        --text: rgba(255, 255, 255, 0.88);
        --dim: rgba(255, 255, 255, 0.35);
        --dimmer: rgba(255, 255, 255, 0.16);
        --radius: 22px;
        --mood-h: 28;
        /* Smooth colour transitions on mood change */
        transition:
          --warm 0.8s ease,
          --warm2 0.8s ease;
      }

      /* @property declarations let CSS custom properties animate smoothly */
      @property --warm {
        syntax: '<color>';
        inherits: true;
        initial-value: #c97d40;
      }
      @property --warm2 {
        syntax: '<color>';
        inherits: true;
        initial-value: #e8b07a;
      }

      html,
      body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: #080c12;
        font-family:
          'DM Mono',
          monospace;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      /* ── Generative background canvas ── */
      #bg {
        position: fixed;
        inset: 0;
        z-index: 0;
      }

      /* ── Bottom sheet ── */
      .sheet {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 10;
        background: var(--glass);
        backdrop-filter: blur(32px) saturate(1.5);
        -webkit-backdrop-filter: blur(32px) saturate(1.5);
        border-top: 1px solid var(--border);
        border-radius: var(--radius) var(--radius) 0 0;
        padding-bottom: env(safe-area-inset-bottom, 16px);
        max-height: 92vh;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }
      .sheet.settling {
        transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .handle {
        width: 36px;
        height: 4px;
        background: var(--dimmer);
        border-radius: 2px;
        margin: 12px auto 6px;
        cursor: grab;
        touch-action: none; /* drag handle only — sheet scroll stays free */
      }
      .handle:active {
        cursor: grabbing;
        background: var(--dim);
      }

      .sheet-body {
        padding: 14px 20px 0;
      }

      /* ── Track info row — play button left, title centre, key chip right ── */
      .info-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .info-text {
        flex: 1;
        min-width: 0;
      }
      .track-name {
        font-family:
          'DM Serif Display',
          serif;
        font-style: italic;
        font-size: clamp(1.1rem, 4.5vw, 1.4rem);
        color: var(--text);
        line-height: 1.1;
        transition: opacity 0.4s;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .track-name.fade {
        opacity: 0;
      }
      .track-sub {
        font-size: 0.6rem;
        color: var(--dim);
        letter-spacing: 0.08em;
        margin-top: 3px;
      }

      /* Key picker — tappable */
      .key-chip {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 6px 12px;
        cursor: pointer;
        flex-shrink: 0;
        transition: background 0.15s;
        min-width: 52px;
      }
      .key-chip:active {
        background: rgba(255, 255, 255, 0.12);
      }
      .key-val {
        font-family:
          'DM Serif Display',
          serif;
        font-size: 1.1rem;
        color: var(--warm);
        line-height: 1;
      }
      .key-lbl {
        font-size: 0.5rem;
        color: var(--dimmer);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-top: 2px;
      }

      /* ── Visualiser ── */
      .wave-wrap {
        margin: 4px -20px 2px;
        height: 56px;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.18);
        position: relative;
      }
      #vis {
        display: block;
        width: 100%;
        height: 56px;
      }

      /* ── Mood row ── */
      .mood-row {
        display: flex;
        gap: 6px;
        padding: 10px 0 8px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .mood-row::-webkit-scrollbar {
        display: none;
      }
      .mood-btn {
        font-family:
          'DM Mono',
          monospace;
        font-size: 0.62rem;
        letter-spacing: 0.06em;
        padding: 7px 13px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.05);
        color: var(--dim);
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition: all 0.15s;
        min-height: 34px;
        display: flex;
        align-items: center;
      }
      .mood-btn:active {
        opacity: 0.7;
      }
      .mood-btn.active {
        background: var(--warm);
        border-color: var(--warm);
        color: #1a0e04;
      }

      /* ── Skip button (still used inline next to play) ── */
      .btn-play {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: var(--warm);
        border: none;
        cursor: pointer;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 24px color-mix(in srgb, var(--warm) 35%, transparent);
        transition:
          transform 0.1s,
          box-shadow 0.1s,
          background 0.8s ease;
      }
      .btn-play:active {
        transform: scale(0.91);
        box-shadow: 0 0 12px color-mix(in srgb, var(--warm) 20%, transparent);
      }
      .btn-play svg {
        width: 20px;
        height: 20px;
        fill: #1a0e04;
      }

      /* Skip button */
      .btn-skip {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border);
        cursor: pointer;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s;
      }
      .btn-skip:active {
        background: rgba(255, 255, 255, 0.12);
      }
      .btn-skip svg {
        width: 18px;
        height: 18px;
        stroke: var(--dim);
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Volume — compact row below mood pills */
      .vol-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 10px;
      }
      .vol-row .ctrl-lbl {
        flex-shrink: 0;
        width: 22px;
      }

      /* Status bar */
      .status-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding-bottom: 6px;
      }
      .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--dimmer);
        flex-shrink: 0;
        transition: background 0.3s;
      }
      .dot.live {
        background: #5ec47a;
        animation: pulse 2.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      .status-txt {
        font-size: 0.55rem;
        color: var(--dimmer);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      /* ── Shared range style ── */

      /* ── Mixer drawer ── */
      .mixer-toggle {
        width: 100%;
        background: transparent;
        border: none;
        border-top: 1px solid var(--border);
        padding: 10px 20px;
        font-family:
          'DM Mono',
          monospace;
        font-size: 0.58rem;
        color: var(--dimmer);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 40px;
        transition: color 0.15s;
      }
      .mixer-toggle:active {
        color: var(--warm);
      }
      .mixer-arrow {
        width: 16px;
        height: 16px;
        stroke: var(--dimmer);
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        transition: transform 0.25s;
      }
      .mixer-toggle.open .mixer-arrow {
        transform: rotate(180deg);
      }

      .mixer-panel {
        display: none;
        padding: 8px 20px 4px;
      }
      .mixer-panel.open {
        display: block;
      }

      .mx-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 9px;
        min-height: 34px;
        border-radius: 4px;
      }
      .mx-lbl {
        font-size: 0.58rem;
        color: var(--dim);
        width: 64px;
        flex-shrink: 0;
        letter-spacing: 0.04em;
      }

      /* Thumb flash — the range input's knob pops when the instrument plays */
      .mx-row input[type="range"].flash::-webkit-slider-thumb {
        background: #fff;
        box-shadow:
          0 0 6px var(--warm),
          0 0 2px #fff;
        transform: scale(1.35);
      }
      .mx-row input[type="range"].flash::-moz-range-thumb {
        background: #fff;
        box-shadow:
          0 0 6px var(--warm),
          0 0 2px #fff;
        transform: scale(1.35);
      }
      input[type="range"] {
        -webkit-appearance: none;
        width: 100%;
        height: 3px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 2px;
        outline: none;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--warm);
        border: 2px solid rgba(0, 0, 0, 0.4);
        cursor: pointer;
        transition:
          transform 0.06s ease,
          background 0.06s ease,
          box-shadow 0.06s ease;
      }
      input[type="range"]::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--warm);
        border: 2px solid rgba(0, 0, 0, 0.4);
        transition:
          transform 0.06s ease,
          background 0.06s ease,
          box-shadow 0.06s ease;
      }
      .mx-row input[type="range"] {
        flex: 1;
      }
      .mx-val {
        font-size: 0.58rem;
        color: var(--dimmer);
        width: 26px;
        text-align: right;
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
      }
      .mx-div {
        height: 1px;
        background: var(--border);
        margin: 4px 0 10px;
      }
    </style>
  </head>
  <body>
    <!-- Generative background -->

    <canvas id="bg"></canvas>

    <!-- Bottom sheet -->

    <div class="sheet" id="sheet">
      <div class="handle"></div>
      <div class="sheet-body">
        <!-- Play + title + key -->
        <div class="info-row">
          <button class="btn-play" id="playBtn" aria-label="Play">
            <svg id="playIcon" viewBox="0 0 20 20">
              <polygon points="4,2 18,10 4,18" />
            </svg>
          </button>
          <button class="btn-skip" id="skipBtn" aria-label="New progression">
            <svg viewBox="0 0 18 18">
              <polyline points="2,4 10,9 2,14" />
              <polyline points="9,4 17,9 9,14" />
            </svg>
          </button>
          <div class="info-text">
            <div class="track-name" id="trackName">lofi forever</div>
            <div class="track-sub" id="trackSub">tap play to begin</div>
          </div>
          <div class="key-chip" id="keyChip" title="Tap to change key">
            <span class="key-val" id="keyVal">&mdash;</span>
            <span class="key-lbl">key</span>
          </div>
        </div>

        <!-- Waveform -->
        <div class="wave-wrap">
          <canvas id="vis" width="400" height="56"></canvas>
        </div>

        <!-- Mood -->
        <div class="mood-row">
          <button class="mood-btn active" data-mood="rainy">rainy</button>
          <button class="mood-btn" data-mood="late">late night</button>
          <button class="mood-btn" data-mood="cafe">café</button>
          <button class="mood-btn" data-mood="sleepy">sleepy</button>
        </div>

        <!-- Volume -->
        <div class="vol-row">
          <span class="ctrl-lbl">vol</span>
          <input
            type="range"
            id="volSlider"
            min="0"
            max="1"
            step="0.01"
            value="0.65"
          />
        </div>

        <!-- Status -->
        <div class="status-bar">
          <div class="dot" id="dot"></div>
          <span class="status-txt" id="statusTxt">ready</span>
        </div>
      </div>

      <!-- Controls panel -->

      <button class="mixer-toggle" id="mixerToggle">
        <span>controls</span>
        <svg class="mixer-arrow" viewBox="0 0 16 16">
          <polyline points="2,5 8,11 14,5" />
        </svg>
      </button>
      <div class="mixer-panel" id="mixerPanel">
        <div class="mx-row" id="mx-drums">
          <span class="mx-lbl">drums</span>
          <input
            type="range"
            data-track="drums"
            min="0"
            max="1"
            step="0.01"
            value="0.9"
          />
          <span class="mx-val" id="val-drums">90</span>
        </div>
        <div class="mx-row" id="mx-bass">
          <span class="mx-lbl">bass</span>
          <input
            type="range"
            data-track="bass"
            min="0"
            max="1"
            step="0.01"
            value="0.85"
          />
          <span class="mx-val" id="val-bass">85</span>
        </div>
        <div class="mx-row" id="mx-comp">
          <span class="mx-lbl">piano</span>
          <input
            type="range"
            data-track="comp"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
          />
          <span class="mx-val" id="val-comp">80</span>
        </div>
        <div class="mx-row" id="mx-melody">
          <span class="mx-lbl">melody</span>
          <input
            type="range"
            data-track="melody"
            min="0"
            max="1"
            step="0.01"
            value="0.75"
          />
          <span class="mx-val" id="val-melody">75</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">hiss</span>
          <input
            type="range"
            data-track="hiss"
            min="0"
            max="1"
            step="0.01"
            value="0.5"
          />
          <span class="mx-val" id="val-hiss">50</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">scratch</span>
          <input
            type="range"
            data-track="scratches"
            min="0"
            max="1"
            step="0.01"
            value="0.7"
          />
          <span class="mx-val" id="val-scratches">70</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">hum</span>
          <input
            type="range"
            data-track="hum"
            min="0"
            max="1"
            step="0.01"
            value="0.4"
          />
          <span class="mx-val" id="val-hum">40</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">warp</span>
          <input
            type="range"
            id="warpSlider"
            min="0"
            max="1"
            step="0.01"
            value="0.3"
          />
          <span class="mx-val" id="val-warp">30</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">ambience</span>
          <input
            type="range"
            data-track="ambience"
            min="0"
            max="1"
            step="0.01"
            value="0.6"
          />
          <span class="mx-val" id="val-ambience">60</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">rain</span>
          <input
            type="range"
            id="rainSlider"
            min="0"
            max="1"
            step="0.01"
            value="0.4"
          />
          <span class="mx-val" id="val-rain">40</span>
        </div>

        <div class="mx-div"></div>

        <div class="mx-row">
          <span class="mx-lbl">tempo</span>
          <input
            type="range"
            id="bpmSlider"
            min="45"
            max="95"
            step="1"
            value="68"
            style="flex: 1"
          />
          <span class="mx-val" id="bpmVal">&mdash;</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">complexity</span>
          <input
            type="range"
            id="complexitySlider"
            min="0"
            max="1"
            step="0.01"
            value="0.5"
          />
          <span class="mx-val" id="val-complexity">50</span>
        </div>
      </div>
    </div>

    <script>
      // ── Generative background — WebGPU flow field with Canvas2D fallback ──────────

      const bgCanvas = document.getElementById("bg");
      let bgMood = "rainy";
      let bgAmplitude = 0;

      const MOOD_COLOURS = {
        rainy: { h: 210, s: 40, r: 10, g: 15, b: 24 },
        late: { h: 260, s: 30, r: 13, g: 10, b: 24 },
        cafe: { h: 28, s: 55, r: 20, g: 10, b: 4 },
        sleepy: { h: 190, s: 35, r: 6, g: 14, b: 18 },
      };

      // ── Try WebGPU ────────────────────────────────────────────────────────────────
      async function tryWebGPU() {
        try {
          if (!navigator.gpu) return false;
          const adapter = await navigator.gpu.requestAdapter();
          if (!adapter) return false;
          const device = await adapter.requestDevice();
          const ctx = bgCanvas.getContext("webgpu");
          if (!ctx) return false;

          const format = navigator.gpu.getPreferredCanvasFormat();

          function resize() {
            const w = window.visualViewport?.width || window.innerWidth;
            const h = window.visualViewport?.height || window.innerHeight;
            bgCanvas.width = Math.max(2, Math.floor(w * devicePixelRatio));
            bgCanvas.height = Math.max(2, Math.floor(h * devicePixelRatio));
            bgCanvas.style.width = w + "px";
            bgCanvas.style.height = h + "px";
            ctx.configure({ device, format, alphaMode: "opaque" });
          }
          resize();
          window.addEventListener("resize", resize);
          window.addEventListener("orientationchange", () =>
            setTimeout(resize, 200),
          );
          if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", resize);
          }

          // Uniforms layout (std140-ish, padded to 16-byte boundaries):
          // time, amp, w, h          (4 floats = 16 bytes)
          // baseR, baseG, baseB, _p1 (4 floats = 16 bytes)
          // 3 blob colours: each vec4(r,g,b,intensity) = 48 bytes
          // Total = 80 bytes
          const uniformBuf = device.createBuffer({
            size: 96,
            usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
          });

          const shaderCode = `
struct Uniforms {
  time: f32, amp: f32, w: f32, h: f32,
  base: vec4f,
  blob0: vec4f,
  blob1: vec4f,
  blob2: vec4f,
}
@group(0) @binding(0) var<uniform> u: Uniforms;

struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f }

@vertex fn vs(@builtin(vertex_index) vi: u32) -> VO {
  // Fullscreen triangle
  var positions = array<vec2f, 3>(
    vec2f(-1.0, -1.0),
    vec2f( 3.0, -1.0),
    vec2f(-1.0,  3.0),
  );
  let p = positions[vi];
  var out: VO;
  out.pos = vec4f(p, 0.0, 1.0);
  out.uv = vec2f((p.x + 1.0) * 0.5, 1.0 - (p.y + 1.0) * 0.5);
  return out;
}

fn blobField(uv: vec2f, cx: f32, cy: f32, r: f32) -> f32 {
  let d = distance(uv, vec2f(cx, cy));
  let n = d / r;
  return exp(-n * n * 2.5);
}

@fragment fn fs(in: VO) -> @location(0) vec4f {
  let uv = in.uv;
  let t = u.time;
  let amp = u.amp;

  // 5 blob centres, each drifting slowly
  // Weighted to upper portion of screen (cy < 0.5)
  let cx0 = 0.25 + sin(t * 0.55 + 0.1) * 0.18;
  let cy0 = 0.20 + cos(t * 0.48 + 1.3) * 0.14;
  let cx1 = 0.72 + sin(t * 0.52 + 2.1) * 0.18;
  let cy1 = 0.24 + cos(t * 0.58 + 0.7) * 0.14;
  let cx2 = 0.50 + sin(t * 0.45 + 4.2) * 0.22;
  let cy2 = 0.35 + cos(t * 0.53 + 2.9) * 0.16;
  let cx3 = 0.18 + sin(t * 0.60 + 3.3) * 0.16;
  let cy3 = 0.42 + cos(t * 0.50 + 5.1) * 0.14;
  let cx4 = 0.82 + sin(t * 0.57 + 5.7) * 0.16;
  let cy4 = 0.32 + cos(t * 0.46 + 4.4) * 0.14;

  // Radius pulses gently and reacts to audio
  let r0 = 0.28 * (0.88 + 0.12 * sin(t * 1.0) + amp * 0.22);
  let r1 = 0.32 * (0.90 + 0.10 * sin(t * 1.1 + 1.0) + amp * 0.20);
  let r2 = 0.40 * (0.86 + 0.14 * sin(t * 0.85 + 2.0) + amp * 0.25);
  let r3 = 0.26 * (0.89 + 0.11 * sin(t * 0.95 + 3.0) + amp * 0.22);
  let r4 = 0.30 * (0.87 + 0.13 * sin(t * 1.05 + 4.0) + amp * 0.20);

  let f0 = blobField(uv, cx0, cy0, r0);
  let f1 = blobField(uv, cx1, cy1, r1);
  let f2 = blobField(uv, cx2, cy2, r2);
  let f3 = blobField(uv, cx3, cy3, r3);
  let f4 = blobField(uv, cx4, cy4, r4);

  // Mix three colours across blobs (cycle through them)
  let col0 = u.blob0.rgb * u.blob0.a * (f0 + f3 * 0.6);
  let col1 = u.blob1.rgb * u.blob1.a * (f1 + f4 * 0.6);
