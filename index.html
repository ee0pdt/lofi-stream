<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>lofi forever</title>
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#c97d40" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="lofi forever" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Serif+Display:ital@0;1&display=swap");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --warm: #c97d40;
        --warm2: #e8b07a;
        --glass: rgba(10, 13, 18, 0.78);
        --border: rgba(255, 255, 255, 0.07);
        --text: rgba(255, 255, 255, 0.88);
        --dim: rgba(255, 255, 255, 0.35);
        --dimmer: rgba(255, 255, 255, 0.16);
        --radius: 22px;
        --mood-h: 28;
        /* Smooth colour transitions on mood change */
        transition:
          --warm 0.8s ease,
          --warm2 0.8s ease;
      }

      /* @property declarations let CSS custom properties animate smoothly */
      @property --warm {
        syntax: '<color>';
        inherits: true;
        initial-value: #c97d40;
      }
      @property --warm2 {
        syntax: '<color>';
        inherits: true;
        initial-value: #e8b07a;
      }

      html,
      body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: #080c12;
        font-family:
          'DM Mono',
          monospace;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      /* ── Generative background canvas ── */
      #bg {
        position: fixed;
        inset: 0;
        z-index: 0;
      }

      /* ── Bottom sheet ── */
      .sheet {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 10;
        background: var(--glass);
        backdrop-filter: blur(32px) saturate(1.5);
        -webkit-backdrop-filter: blur(32px) saturate(1.5);
        border-top: 1px solid var(--border);
        border-radius: var(--radius) var(--radius) 0 0;
        padding-bottom: env(safe-area-inset-bottom, 16px);
        max-height: 92vh;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }
      .sheet.settling {
        transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .handle {
        width: 36px;
        height: 4px;
        background: var(--dimmer);
        border-radius: 2px;
        margin: 12px auto 6px;
        cursor: grab;
        touch-action: none; /* drag handle only — sheet scroll stays free */
      }
      .handle:active {
        cursor: grabbing;
        background: var(--dim);
      }

      .sheet-body {
        padding: 14px 20px 0;
      }

      /* ── Track info row — play button left, title centre, key chip right ── */
      .info-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .info-text {
        flex: 1;
        min-width: 0;
      }
      .track-name {
        font-family:
          'DM Serif Display',
          serif;
        font-style: italic;
        font-size: clamp(1.1rem, 4.5vw, 1.4rem);
        color: var(--text);
        line-height: 1.1;
        transition: opacity 0.4s;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .track-name.fade {
        opacity: 0;
      }
      .track-sub {
        font-size: 0.6rem;
        color: var(--dim);
        letter-spacing: 0.08em;
        margin-top: 3px;
      }

      /* Key picker — tappable */
      .key-chip {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 6px 12px;
        cursor: pointer;
        flex-shrink: 0;
        transition: background 0.15s;
        min-width: 52px;
      }
      .key-chip:active {
        background: rgba(255, 255, 255, 0.12);
      }
      .key-val {
        font-family:
          'DM Serif Display',
          serif;
        font-size: 1.1rem;
        color: var(--warm);
        line-height: 1;
      }
      .key-lbl {
        font-size: 0.5rem;
        color: var(--dimmer);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-top: 2px;
      }

      /* ── Visualiser ── */
      .wave-wrap {
        margin: 4px -20px 2px;
        height: 56px;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.18);
        position: relative;
      }
      #vis {
        display: block;
        width: 100%;
        height: 56px;
      }

      /* ── Mood row ── */
      .mood-row {
        display: flex;
        gap: 6px;
        padding: 10px 0 8px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .mood-row::-webkit-scrollbar {
        display: none;
      }
      .mood-btn {
        font-family:
          'DM Mono',
          monospace;
        font-size: 0.62rem;
        letter-spacing: 0.06em;
        padding: 7px 13px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.05);
        color: var(--dim);
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition: all 0.15s;
        min-height: 34px;
        display: flex;
        align-items: center;
      }
      .mood-btn:active {
        opacity: 0.7;
      }
      .mood-btn.active {
        background: var(--warm);
        border-color: var(--warm);
        color: #1a0e04;
      }

      /* ── Skip button (still used inline next to play) ── */
      .btn-play {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: var(--warm);
        border: none;
        cursor: pointer;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 24px color-mix(in srgb, var(--warm) 35%, transparent);
        transition:
          transform 0.1s,
          box-shadow 0.1s,
          background 0.8s ease;
      }
      .btn-play:active {
        transform: scale(0.91);
        box-shadow: 0 0 12px color-mix(in srgb, var(--warm) 20%, transparent);
      }
      .btn-play svg {
        width: 20px;
        height: 20px;
        fill: #1a0e04;
      }

      /* Skip button */
      .btn-skip {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border);
        cursor: pointer;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s;
      }
      .btn-skip:active {
        background: rgba(255, 255, 255, 0.12);
      }
      .btn-skip svg {
        width: 18px;
        height: 18px;
        stroke: var(--dim);
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Volume — compact row below mood pills */
      .vol-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 10px;
      }
      .vol-row .ctrl-lbl {
        flex-shrink: 0;
        width: 22px;
      }

      /* Status bar */
      .status-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding-bottom: 6px;
      }
      .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--dimmer);
        flex-shrink: 0;
        transition: background 0.3s;
      }
      .dot.live {
        background: #5ec47a;
        animation: pulse 2.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      .status-txt {
        font-size: 0.55rem;
        color: var(--dimmer);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .version-txt {
        font-size: 0.5rem;
        color: rgba(255, 255, 255, 0.45);
        margin-left: auto;
        font-family: monospace;
      }

      /* ── Shared range style ── */

      /* ── Mixer drawer ── */
      .mixer-toggle {
        width: 100%;
        background: transparent;
        border: none;
        border-top: 1px solid var(--border);
        padding: 10px 20px;
        font-family:
          'DM Mono',
          monospace;
        font-size: 0.58rem;
        color: var(--dimmer);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 40px;
        transition: color 0.15s;
      }
      .mixer-toggle:active {
        color: var(--warm);
      }
      .mixer-arrow {
        width: 16px;
        height: 16px;
        stroke: var(--dimmer);
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        transition: transform 0.25s;
      }
      .mixer-toggle.open .mixer-arrow {
        transform: rotate(180deg);
      }

      .mixer-panel {
        display: none;
        padding: 8px 20px 4px;
      }
      .mixer-panel.open {
        display: block;
      }

      .mx-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 9px;
        min-height: 34px;
        border-radius: 4px;
      }
      .mx-lbl {
        font-size: 0.58rem;
        color: var(--dim);
        width: 64px;
        flex-shrink: 0;
        letter-spacing: 0.04em;
      }

      /* Thumb flash — the range input's knob pops when the instrument plays */
      .mx-row input[type="range"].flash::-webkit-slider-thumb {
        background: #fff;
        box-shadow:
          0 0 6px var(--warm),
          0 0 2px #fff;
        transform: scale(1.35);
      }
      .mx-row input[type="range"].flash::-moz-range-thumb {
        background: #fff;
        box-shadow:
          0 0 6px var(--warm),
          0 0 2px #fff;
        transform: scale(1.35);
      }
      input[type="range"] {
        -webkit-appearance: none;
        width: 100%;
        height: 3px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 2px;
        outline: none;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--warm);
        border: 2px solid rgba(0, 0, 0, 0.4);
        cursor: pointer;
        transition:
          transform 0.06s ease,
          background 0.06s ease,
          box-shadow 0.06s ease;
      }
      input[type="range"]::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--warm);
        border: 2px solid rgba(0, 0, 0, 0.4);
        transition:
          transform 0.06s ease,
          background 0.06s ease,
          box-shadow 0.06s ease;
      }
      .mx-row input[type="range"] {
        flex: 1;
      }
      .mx-val {
        font-size: 0.58rem;
        color: var(--dimmer);
        width: 26px;
        text-align: right;
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
      }
      .mx-div {
        height: 1px;
        background: var(--border);
        margin: 4px 0 10px;
      }

      /* ── Knob grid ── */
      .kn-grid {
        --kn-size: 52px;
        --kn-drag-px: 200;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px 8px;
        padding: 12px 0 8px;
      }
      .kn-cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .kn-wrap {
        position: relative;
        width: var(--kn-size);
        height: var(--kn-size);
        border-radius: 50%;
        touch-action: none;
      }
      .kn-wrap:focus-within {
        outline: 2px solid var(--warm);
        outline-offset: 3px;
      }
      .kn-svg {
        width: var(--kn-size);
        height: var(--kn-size);
        display: block;
        pointer-events: none;
      }
      .kn-body {
        fill: #1a1d24;
      }
      .kn-track {
        fill: none;
        stroke: rgba(255, 255, 255, 0.12);
        stroke-width: 3;
        stroke-linecap: round;
      }
      .kn-fill {
        fill: none;
        stroke: var(--warm);
        stroke-width: 3;
        stroke-linecap: round;
        transition: stroke 0.06s ease;
      }
      .kn-dot {
        fill: var(--warm);
        transition: fill 0.06s ease;
      }
      .kn-input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
        margin: 0;
        -webkit-appearance: none;
        border-radius: 50%;
      }
      .kn-lbl {
        font-size: 0.58rem;
        color: var(--dim);
        letter-spacing: 0.04em;
        text-align: center;
      }
      .kn-val {
        font-size: 0.58rem;
        color: var(--dimmer);
        font-variant-numeric: tabular-nums;
        text-align: center;
      }
      /* Flash: brighten fill arc + dot when instrument plays */
      .kn-cell.flash .kn-fill {
        stroke: #fff;
        filter: drop-shadow(0 0 4px var(--warm));
      }
      .kn-cell.flash .kn-dot {
        fill: #fff;
        filter: drop-shadow(0 0 4px var(--warm));
      }

      /* iOS "Add to Home Screen" banner — shown only in Safari before install */
      #iosBanner {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 9999;
        padding: max(12px, env(safe-area-inset-top)) 16px 12px;
        background: rgba(10, 13, 18, 0.97);
        border-bottom: 1px solid var(--border);
        align-items: center;
        gap: 12px;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      #iosBannerText {
        flex: 1;
        font-size: 0.72rem;
        color: var(--text);
        line-height: 1.5;
      }
      #iosBannerText strong {
        color: var(--warm);
      }
      #iosBannerDismiss {
        background: none;
        border: none;
        color: var(--dim);
        font-size: 1.1rem;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 4px;
        line-height: 1;
        font-family: inherit;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <!-- iOS install prompt (Safari only, pre-install) -->
    <div id="iosBanner">
      <span id="iosBannerText"
        >For background audio: tap <strong>Share ↑</strong> &rarr;
        <strong>Add to Home Screen</strong></span
      >
      <button id="iosBannerDismiss" aria-label="Dismiss">&times;</button>
    </div>

    <!-- Generative background -->

    <canvas id="bg"></canvas>

    <!-- Bottom sheet -->

    <div class="sheet" id="sheet">
      <div class="handle"></div>
      <div class="sheet-body">
        <!-- Play + title + key -->
        <div class="info-row">
          <button class="btn-play" id="playBtn" aria-label="Play">
            <svg id="playIcon" viewBox="0 0 20 20">
              <polygon points="4,2 18,10 4,18" />
            </svg>
          </button>
          <button class="btn-skip" id="skipBtn" aria-label="New progression">
            <svg viewBox="0 0 18 18">
              <polyline points="2,4 10,9 2,14" />
              <polyline points="9,4 17,9 9,14" />
            </svg>
          </button>
          <div class="info-text">
            <div class="track-name" id="trackName">lofi forever</div>
            <div class="track-sub" id="trackSub">tap play to begin</div>
          </div>
          <div class="key-chip" id="keyChip" title="Tap to change key">
            <span class="key-val" id="keyVal">&mdash;</span>
            <span class="key-lbl">key</span>
          </div>
        </div>

        <!-- Waveform -->
        <div class="wave-wrap">
          <canvas id="vis" width="400" height="56"></canvas>
        </div>

        <!-- Mood -->
        <div class="mood-row">
          <button class="mood-btn active" data-mood="rainy">rainy</button>
          <button class="mood-btn" data-mood="late">late night</button>
          <button class="mood-btn" data-mood="cafe">café</button>
          <button class="mood-btn" data-mood="sleepy">sleepy</button>
          <button class="mood-btn" data-mood="transit">transit</button>
        </div>

        <!-- Volume -->
        <div class="vol-row">
          <span class="ctrl-lbl">vol</span>
          <input
            type="range"
            id="volSlider"
            min="0"
            max="1"
            step="0.01"
            value="0.65"
          />
        </div>

        <!-- Status -->
        <div class="status-bar">
          <div class="dot" id="dot"></div>
          <span class="status-txt" id="statusTxt">ready</span>
          <span class="version-txt" id="versionTxt"></span>
        </div>
      </div>

      <!-- Controls panel -->

      <button class="mixer-toggle" id="mixerToggle">
        <span>controls</span>
        <svg class="mixer-arrow" viewBox="0 0 16 16">
          <polyline points="2,5 8,11 14,5" />
        </svg>
      </button>
      <div class="mixer-panel" id="mixerPanel">
        <div class="mx-row" id="mx-drums">
          <span class="mx-lbl">drums</span>
          <input
            type="range"
            data-track="drums"
            min="0"
            max="1"
            step="0.01"
            value="0.9"
          />
          <span class="mx-val" id="val-drums">90</span>
        </div>
        <div class="mx-row" id="mx-bass">
          <span class="mx-lbl">bass</span>
          <input
            type="range"
            data-track="bass"
            min="0"
            max="1"
            step="0.01"
            value="0.85"
          />
          <span class="mx-val" id="val-bass">85</span>
        </div>
        <div class="mx-row" id="mx-comp">
          <span class="mx-lbl">piano</span>
          <input
            type="range"
            data-track="comp"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
          />
          <span class="mx-val" id="val-comp">80</span>
        </div>
        <div class="mx-row" id="mx-melody">
          <span class="mx-lbl">melody</span>
          <input
            type="range"
            data-track="melody"
            min="0"
            max="1"
            step="0.01"
            value="0.75"
          />
          <span class="mx-val" id="val-melody">75</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">hiss</span>
          <input
            type="range"
            data-track="hiss"
            min="0"
            max="1"
            step="0.01"
            value="0.5"
          />
          <span class="mx-val" id="val-hiss">50</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">scratch</span>
          <input
            type="range"
            data-track="scratches"
            min="0"
            max="1"
            step="0.01"
            value="0.7"
          />
          <span class="mx-val" id="val-scratches">70</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">hum</span>
          <input
            type="range"
            data-track="hum"
            min="0"
            max="1"
            step="0.01"
            value="0.4"
          />
          <span class="mx-val" id="val-hum">40</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">warp</span>
          <input
            type="range"
            id="warpSlider"
            min="0"
            max="1"
            step="0.01"
            value="0.3"
          />
          <span class="mx-val" id="val-warp">30</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">ambience</span>
          <input
            type="range"
            data-track="ambience"
            min="0"
            max="1"
            step="0.01"
            value="0.6"
          />
          <span class="mx-val" id="val-ambience">60</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">rain</span>
          <input
            type="range"
            id="rainSlider"
            min="0"
            max="1"
            step="0.01"
            value="0.4"
          />
          <span class="mx-val" id="val-rain">40</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">reverb</span>
          <input
            type="range"
            id="reverbSlider"
            min="0"
            max="1"
            step="0.01"
            value="0.3"
          />
          <span class="mx-val" id="val-reverb">30</span>
        </div>

        <div class="mx-div"></div>

        <div class="mx-row">
          <span class="mx-lbl">tempo</span>
          <input
            type="range"
            id="bpmSlider"
            min="45"
            max="95"
            step="1"
            value="68"
            style="flex: 1"
          />
          <span class="mx-val" id="bpmVal">&mdash;</span>
        </div>
        <div class="mx-row">
          <span class="mx-lbl">complexity</span>
          <input
            type="range"
            id="complexitySlider"
            min="0"
            max="1"
            step="0.01"
            value="0.5"
          />
          <span class="mx-val" id="val-complexity">50</span>
        </div>
      </div>
    </div>

    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
